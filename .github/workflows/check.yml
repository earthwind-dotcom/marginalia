name: check
on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check marginalia.html against the conventions
        run: python3 check.py marginalia.html
