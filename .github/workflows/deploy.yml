# Build the static site and publish it to GitHub Pages.
#
# The site is served from https://<owner>.github.io/<repo>/, not from a domain
# root, so MARGINALIA_BASE gives every link and asset that prefix. When a real
# domain is added, set MARGINALIA_URL to it and clear MARGINALIA_BASE.
#
# GitHub Pages on a PRIVATE repository requires a paid plan. On the free plan
# the repository has to be public for this to run.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for the preview images
        run: pip install pillow

      - name: Check the conventions before shipping anything
        run: |
          python3 check.py marginalia.html
          python3 test_check.py

      - name: Build
        env:
          MARGINALIA_URL: https://${{ github.repository_owner }}.github.io
          MARGINALIA_BASE: ${{ github.event.repository.name }}
        run: python3 build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
